<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BOUNCY — Next-Gen Social Video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('bouncy-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800;12..96,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --fg: #ffffff;
      --mute: #8e8e93;
      --line: rgba(255,255,255,0.12);
      --soft: rgba(255,255,255,0.06);
      --accent: #fe2c55;
      --accent-glow: rgba(254, 44, 85, 0.4);
      --gold: #ffda6b;
      --f: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-weight: 500; overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; user-select: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    
    #app {
      max-width: 440px;
      height: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      border-inline: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    /* Luxury Header */
    header {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -0.02em;
      gap: 10px;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }
    header i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #ff007f);
      box-shadow: 0 0 12px var(--accent-glow);
      animation: hop 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: bottom;
    }
    @keyframes hop { 50% { transform: translateY(-7px) scale(1.1); } }

    main { flex: 1; position: relative; min-height: 0; }
    .v { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
    .v::-webkit-scrollbar { display: none; }
    .hide { display: none !important; }

    /* Feed & Fullscreen Video Stage */
    #feed { scroll-snap-type: y mandatory; overscroll-behavior: contain; }
    .clip { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; overflow: hidden; background: #000; }
    .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .clip::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 25%, transparent 60%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Floating Side Actions (TikTok / Instagram Style) */
    .side { position: absolute; right: 12px; bottom: 30px; display: flex; flex-direction: column; gap: 16px; align-items: center; z-index: 2; }
    .side button {
      display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; font-size: 11px; font-weight: 800; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .side button .icon-wrap {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.4); backdrop-filter: blur(12px);
      display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.18); transition: transform 0.2s ease;
    }
    .side button:active .icon-wrap { transform: scale(0.88); }
    svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .liked .icon-wrap { background: rgba(254, 44, 85, 0.2); border-color: var(--accent); color: var(--accent); }
    .liked svg { fill: currentColor; }

    /* Floating Video Meta Overlay */
    .meta { position: absolute; left: 16px; right: 84px; bottom: 28px; color: #fff; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    .meta strong { font-weight: 900; font-size: 19px; display: inline-flex; align-items: center; gap: 6px; }
    .meta p { margin: 6px 0 0; line-height: 1.4; font-size: 14px; opacity: 0.95; }
    .meta .sn { margin-top: 10px; font-size: 12px; font-weight: 600; opacity: 0.85; display: flex; align-items: center; gap: 6px; }

    /* Ultra Bottom Navigation Bar */
    nav {
      height: 62px;
      display: flex;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      position: relative;
      z-index: 10;
    }
    nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 800; color: var(--mute); transition: color 0.2s; }
    nav button.on { color: #fff; }
    nav .plus { flex: 0 0 64px; }
    nav .plus span {
      display: inline-grid; place-items: center; width: 48px; height: 34px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #ff007f); color: #fff; font-size: 24px; font-weight: 900;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    #nball { position: absolute; top: 0; width: 24px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; }

    /* Modals & Sheet Overlay System */
    #shade { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; z-index: 50; }
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; background: #12131a; border-radius: 28px 28px 0 0;
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: none; flex-direction: column; z-index: 51;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.15); color: #fff;
    }
    #shade.o, #sheet.o { display: flex; }
    #sheet::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 16px; flex: none; }
    #sheet h3 { font-size: 20px; font-weight: 800; margin: 0 0 14px; letter-spacing: -0.01em; }

    /* Buttons & Inputs */
    .btn {
      background: linear-gradient(135deg, var(--accent), #e01b4c); color: #fff; border-radius: 14px; padding: 14px 20px;
      font-weight: 800; font-size: 15px; border: 0; width: 100%; min-height: 48px; display: grid; place-items: center;
      box-shadow: 0 4px 16px var(--accent-glow); transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .fol { border: 1.5px solid var(--fg); border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 13px; background: transparent; color: #fff; }
    .fol.on { background: #fff; color: #000; }
    
    /* Billionaire Monetization Badges & Cards */
    .vault-card {
      background: linear-gradient(135deg, rgba(255, 218, 107, 0.15), rgba(255, 140, 0, 0.1));
      border: 1px solid rgba(255, 218, 107, 0.3); border-radius: 20px; padding: 18px; margin: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .vault-title { font-size: 13px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; }
    .vault-value { font-size: 26px; font-weight: 900; color: #fff; margin-top: 2px; }

    /* Toast System */
    #toast {
      position: absolute; left: 50%; top: 68px; transform: translateX(-50%) translateY(-10px);
      background: rgba(20,20,25,0.9); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(14px);
      color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 800; font-size: 14px;
      opacity: 0; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; z-index: 99;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #toast.o { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="app" class="watch">
    <header>
      <i></i>BOUNCY
      <div class="tabs" style="margin-left:auto; display:flex; gap:12px; font-size:15px;">
        <button class="on" data-t="foryou" style="font-weight:800; color:#fff;">For you</button>
        <button data-t="following" style="font-weight:800; color:var(--mute);">Following</button>
      </div>
    </header>

    <main>
      <div id="feed" class="v"></div>
      <div id="trend" class="v hide"></div>
      <div id="me" class="v hide"></div>
      <div id="user" class="v hide"></div>

    <nav>
      <i id="nball"></i>
      <button data-v="feed" class="on">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>

      <button class="plus" id="up" aria-label="Upload a video"><span>+</span></button>
      <button data-v="inbox">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>

      <button data-v="me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>

    <div id="shade"></div>
    <div id="sheet" role="dialog"></div>
    <div id="toast" role="status"></div>
    <input type="file" id="file" accept="video/*" hidden>
    <input type="file" id="pic" accept="image/*" hidden>
  </div>

  <script>
    const SB_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
    const SB_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    const $ = s => document.querySelector(s);
    const feed = $('#feed'), sheet = $('#sheet'), shade = $('#shade');
    let me = null, clips = [], tt, soundOn = true;

    function toast(t) {
      const e = $('#toast'); e.textContent = t; e.classList.add('o');
      clearTimeout(tt); tt = setTimeout(() => e.classList.remove('o'), 2400);
    }

    function openSheet(node) {
      sheet.replaceChildren(node); sheet.classList.add('o'); shade.classList.add('o');
    }
    function closeSheet() {
      sheet.classList.remove('o'); shade.classList.remove('o');
    }
    shade.onclick = closeSheet;

    // Billionaire Monetization & Wallet Integration
    window.openVaultModal = function() {
      const d = document.createElement('div');
      d.innerHTML = `
        <h3>💎 Bouncy Coin Vault</h3>
        <p style="color:var(--mute); font-size:14px; margin-top:-8px;">Buy coins to send high-roller gifts to top creators.</p>
        <div class="vault-card" style="margin:16px 0;">
          <div>
            <div class="vault-title">Your Coin Balance</div>
            <div class="vault-value">50,000 Coins</div>
          </div>
          <span style="font-size:32px;">🪙</span>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
          <button class="btn" style="background:var(--soft); border:1px solid var(--line); color:#fff;" onclick="toast('10,000 Coins Added (Test mode)')">+10,000 Coins</button>
          <button class="btn" onclick="toast('Redirecting to Checkout...')">Buy Coins ($9.99)</button>

    // Navigation and Routing
    document.querySelectorAll('nav [data-v]').forEach(b => {
      b.onclick = () => {
        const target = b.dataset.v;

        ['feed','trend','me','user','inbox','chat'].forEach(k => $('#'+k).classList.toggle('hide', k !== target));
        $('#app').classList.toggle('watch', target === 'feed');
      };
    });

    toast("Welcome to BOUNCY — Investor Edition");
  </script>
</body>
</html>
