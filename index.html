 hs.forEach(x=>{const P=pm[x.host_id]||{username:'user'};d.append(h('button',{class:'row',on:{click:()=>watchLive({id:x.id,host_id:x.host_id,u:P.username})}},avatar(P.username,P.avatar_url,52),h('div',{class:'t'},h('b',{},'@'+P.username),h('span',{},x.title)),h('span',{style:'background:#e5484d;color:#fff;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px'},'LIVE')))})}

/* ---------- shell ---------- */
const NAV=[['feed','home','Home'],['disc','disc','Discover'],['up','','',1],['inbox','inbox','Inbox'],['me','user','Profile']];
$('#nav').append(...NAV.map(([v,ic,l,plus])=>plus?h('button',{class:'plus','aria-label':'Create',on:{click:create}},h('span',{},'+')):h('button',{'data-v':v,on:{click:()=>{if(v=='feed'&&view=='feed'){loadFeed();return}show(v)}}},svg(ic),l)));
function show(v){if(!me&&(v=='me'||v=='inbox')){authSheet(v=='me'?'see your profile':'see your inbox');return}
 view=v;['feed','disc','inbox','me','user'].forEach(k=>$('#'+k).hidden=k!=v);$('#top').hidden=v!='feed';$('#nav').classList.toggle('dark',v=='feed');
 document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v||(v=='user'&&b.dataset.v=='disc')));
 document.querySelectorAll('#feed video').forEach(x=>v=='feed'?0:x.pause());
 if(v=='feed')document.querySelectorAll('.clip').forEach(s=>{const r=s.getBoundingClientRect(),p=$('#feed').getBoundingClientRect();if(r.top>=p.top-5&&r.top<p.bottom-5)s.querySelector('video').play().catch(()=>{})});
 if(v=='disc')drawDisc();if(v=='inbox')drawInbox();if(v=='me')renderProfile($('#me'),me.id)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)document.querySelectorAll('video').forEach(v=>v.pause())});
async function start(u){me={id:u.id,email:u.email};const {data}=await sb.from('profiles').select('username,avatar_url,bio').eq('id',u.id).single();me.username=data?data.username:'user';me.bio=(data&&data.bio)||'';
 const want=u.user_metadata&&u.user_metadata.username;if(want&&me.username.startsWith('user_')){const r=await sb.from('profiles').update({username:want}).eq('id',u.id);if(!r.error)me.username=want}
 closeSheet();unread();listenCalls();show('feed');await loadFeed();deep()}
function deep(){const p=new URLSearchParams(location.search),v=p.get('v'),u=p.get('u'),ok=x=>x&&/^[0-9a-f-]{36}$/i.test(x);if(ok(v)){history.replaceState(null,'',location.pathname);sb.from('videos').select(COLS).eq('id',v).single().then(async r=>{if(!r.data){toast('That video isn’t available anymore');return}watch((await hydrate([r.data]))[0])})}else if(ok(u)){history.replaceState(null,'',location.pathname);showUser(u)}}
sb.auth.onAuthStateChange((ev,s)=>{if((ev=='SIGNED_IN'||ev=='INITIAL_SESSION')&&s&&(!me||me.id!=s.user.id))setTimeout(()=>start(s.user),0);if(ev=='SIGNED_OUT'){if(inCh){sb.removeChannel(inCh);inCh=null}me=null;closeChat();show('feed');tab='foryou';markTabs();loadFeed()}});
sb.auth.getSession().then(({data})=>{if(!data.session&&!me){show('feed');loadFeed().then(deep)}});
setTimeout(()=>{const s=$('#splash');s.classList.add('out');setTimeout(()=>s.remove(),450)},1600);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
