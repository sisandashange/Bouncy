function newPassSheet(){const d=el('<h3>Set a new password</h3><div class="col"><input type="password" id="np" placeholder="New password (8+ characters)" aria-label="New password" autocomplete="new-password"></div><div class="row"><button class="btn" id="npb">Save password</button></div><p id="npm" class="sub" style="margin:10px 0 0" role="alert"></p>');
d.querySelector('#npb').onclick=async()=>{const x=d.querySelector('#np').value;if(x.length<8){d.querySelector('#npm').textContent='Use at least 8 characters.';return}const r=await sb.auth.updateUser({password:x});if(r.error){d.querySelector('#npm').textContent=r.error.message;return}recovering=false;close();toast('Password updated')};open(d)}
async function start(user){me=user;me.email=user.email;const {data}=await sb.from('profiles').select('username,avatar_url,bio,who_can_message,show_online,display_name,verified').eq('id',user.id).single();me.username=data?data.username:'user';me.avatar=data&&data.avatar_url;me.bio=(data&&data.bio)||'';me.display=(data&&data.display_name)||'';me.verified=!!(data&&data.verified);me.who=(data&&data.who_can_message)||'everyone';me.showOnline=!(data&&data.show_online===false);startPresence();sb.rpc('is_admin').then(r=>{me.admin=r.data===true});
const want=user.user_metadata&&user.user_metadata.username;
if(want&&me.username.startsWith('user_')){const r=await sb.from('profiles').update({username:want}).eq('id',user.id);if(!r.error)me.username=want;else toast('That username is taken. You can change it later.')}
if(!recovering)close();show('feed');await load();unread();
deep()}
sb.auth.onAuthStateChange((ev,s)=>{if(ev=='PASSWORD_RECOVERY'){recovering=true;setTimeout(newPassSheet,400)}if((ev=='SIGNED_IN'||ev=='INITIAL_SESSION')&&s&&(!me||me.id!==s.user.id))setTimeout(()=>start(s.user),0);if(ev=='SIGNED_OUT'){if(presCh){sb.removeChannel(presCh);presCh=null;online=new Set()}me=null;clips=[];close();dot(0);show('feed');load()}});
