<style>
:root{--bg:#fff;--fg:#000;--mute:#666;--line:#e2e2e2;--soft:#f0f0f0;--f:'Bricolage Grotesque',system-ui,sans-serif;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{max-width:430px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:1px solid var(--line);position:relative;overflow:hidden}
header{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:22px;letter-spacing:.02em;gap:8px}

@keyframes hop{50%{transform:translateY(-6px)}}
main{flex:1;position:relative;min-height:0}
.v{position:absolute;inset:0;overflow-y:auto}
.hide{display:none}
#feed{scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--bg)}
.clip.real{--fg:#fff;--bg:#000}
.p0{background-image:repeating-linear-gradient(90deg,transparent 0 28px,var(--line) 28px 30px)}
.p1{background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:24px 24px}

.p3{background-image:repeating-linear-gradient(45deg,transparent 0 22px,var(--line) 22px 24px)}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ball{position:absolute;left:calc(50% - 32px);bottom:36%;width:64px;height:64px;border-radius:50%;background:var(--fg);transform-origin:bottom;animation:b 1.2s infinite}
.sh{position:absolute;left:calc(50% - 32px);bottom:calc(36% - 8px);width:64px;height:12px;border-radius:50%;background:var(--fg);animation:s 1.2s infinite}
.clip:not(.on) .ball,.clip:not(.on) .sh{animation-play-state:paused}
@keyframes b{0%,100%{transform:translateY(0) scale(1.3,.7);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-190px) scale(.92,1.1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes s{0%,100%{transform:scale(1.2);opacity:.35}50%{transform:scale(.4);opacity:.1}}
.side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;min-height:52px;font-size:12px;font-weight:800;color:var(--fg);text-shadow:0 0 6px var(--bg)}
svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.liked svg{fill:currentColor}
.meta{position:absolute;left:14px;right:80px;bottom:24px;color:var(--fg);text-shadow:0 0 8px var(--bg)}
.meta strong{font-weight:800;font-size:17px;margin-right:10px}
.meta p{margin:6px 0 0;line-height:1.35}
.fol{border:1.5px solid var(--fg);border-radius:20px;padding:4px 14px;font-weight:800;font-size:13px;background:var(--bg)}
.fol.on{background:var(--fg);color:var(--bg)}
.burst{position:absolute;font-size:80px;line-height:1;pointer-events:none;color:var(--fg);animation:pop .7s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1.4) translateY(-30px);opacity:0}}
nav{height:60px;display:flex;border-top:1px solid var(--line)}
nav button{flex:1;font-weight:800;font-size:14px;color:var(--mute)}
nav button.on{color:var(--fg)}
nav .plus{flex:0 0 64px}
nav .plus span{display:inline-grid;place-items:center;width:46px;height:34px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:24px;line-height:1}
h2{font-size:26px;margin:18px 16px 4px;font-weight:800}
.sub{margin:0 16px 14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tile{aspect-ratio:3/4;position:relative;border:0;background-color:var(--bg);color:var(--fg);text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;outline:1px solid var(--line)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.tile .rk{position:absolute;top:8px;left:10px;font-size:34px;font-weight:800}
.prof{display:flex;gap:16px;align-items:center;padding:20px 16px}
.av{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:800}
.stats{display:flex;gap:20px}.stats div{text-align:center}.stats b{display:block;font-size:20px}.stats span{color:var(--mute);font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--mute);grid-column:1/-1}
.btn{background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 20px;font-weight:800;margin-top:14px}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:5}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:75%;background:var(--bg);border-top:1.5px solid var(--fg);border-radius:20px 20px 0 0;padding:16px;display:none;flex-direction:column;z-index:6}
#shade.o,#sheet.o{display:flex}
#sheet h3{margin:0 0 10px;font-size:18px;font-weight:800}
#sheet .list{overflow-y:auto;flex:1;min-height:80px}
.cm{padding:8px 0;border-bottom:1px solid var(--line)}.cm b{margin-right:8px}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:12px;padding:12px;font:inherit}
.row .btn{margin:0}
#sheet video{width:100%;max-height:34vh;background:#000;border-radius:12px}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.o{opacity:1}
@media (prefers-reduced-motion:reduce){.ball,.sh,header i{animation:none}.ball{transform:translateY(-90px)}}
.col{display:flex;flex-direction:column;gap:10px}[hidden]{display:none!important}.tile{background:#000;color:#fff}.tile b,.tile span{text-shadow:0 0 6px #000}.tabs{margin-left:auto;display:flex;align-items:center;gap:2px}.tabs button{font-size:14px;font-weight:800;color:var(--mute);padding:8px 8px;border-bottom:2px solid transparent}.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}.tabs svg{width:22px;height:22px}#chat:not(.hide){display:flex;flex-direction:column;overflow:hidden}#sheet .row{flex-wrap:wrap}
nav button:not(.plus){display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800}

#app.watch header{position:absolute;top:0;left:0;right:0;z-index:4;border:0;color:#fff;--fg:#fff;--mute:rgba(255,255,255,.7);background:linear-gradient(rgba(0,0,0,.55),transparent);height:60px}
#app.watch nav{background:#000;border-color:#222;--fg:#fff;--bg:#000;--mute:#8a8a8a;--line:#222;color:#fff}
header{height:56px}h2{font-size:30px;letter-spacing:-.01em}
.tabs button{font-size:15px}
.cm{padding:12px 0}
#app:not(.watch) .tabs{display:none}textarea{width:100%;font:inherit;border:1.5px solid var(--fg);border-radius:12px;padding:12px;background:var(--bg);color:var(--fg);resize:none}#app.chatting header{display:none}:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--soft:#1c1c1c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--soft:#1c1c1c;color-scheme:dark}}
#sheet{overflow-y:auto}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* screen titles stay put while you scroll */
.v>h2{position:sticky;top:0;z-index:3;background:var(--bg);margin:0;padding:0 16px;height:58px;display:flex;align-items:center;font-size:28px}
/* bottom sheets */
#sheet{border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));border-top:0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}

.fol{padding:7px 16px;font-size:14px}

/* video screen: readable text and tidy action column */

.side,.meta{z-index:2}
.side{gap:12px}
.meta strong{font-size:18px}

/* chat */
#chat .row input{border-radius:24px;padding:0 16px;height:46px}

/* lists and cards */
.cm{padding:13px 0}
.empty{line-height:1.5}
#chat .row #at,#chat .row #mk{padding:0 12px}.pgb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3);z-index:2}.pgb i{display:block;height:100%;width:0;background:#fff}.sn{margin-top:8px;font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);overflow:hidden;transition:opacity .55s ease,transform .55s ease}
#splash:not(.go),#splash:not(.go) *{animation-play-state:paused!important}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
.sp-stage{position:absolute;inset:0;max-width:430px;margin:auto;animation:sp-shake .5s 2s both}
.sp-floor{position:absolute;left:12%;right:12%;top:58%;height:2px;background:linear-gradient(90deg,transparent,currentColor 18%,currentColor 82%,transparent);transform:scaleX(0);animation:sp-line .7s .1s cubic-bezier(.16,1,.3,1) forwards}
.sp-shadow{position:absolute;left:50%;top:58%;width:76px;height:10px;margin:-3px 0 0 -38px;border-radius:50%;background:currentColor;filter:blur(4px);opacity:0;animation:sp-shadow 2s .2s both}
.sp-ball{position:absolute;left:50%;top:calc(58% - 64px);width:64px;height:64px;margin-left:-32px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.38),transparent 46%),linear-gradient(currentColor,currentColor);transform-origin:50% 100%;animation:sp-ball 2s .2s both}
.sp-ring{position:absolute;left:50%;top:58%;width:30px;height:8px;margin:-4px 0 0 -15px;border:1.5px solid currentColor;border-radius:50%;opacity:0;animation:sp-ring .9s var(--t) ease-out forwards}
.sp-crack{position:absolute;left:50%;top:calc(58% - 2px);width:320px;height:24px;margin-left:-160px;opacity:0;stroke-dasharray:520;stroke-dashoffset:520;animation:sp-crack .45s 2s cubic-bezier(.2,.7,.3,1) forwards}
.sp-d{position:absolute;left:50%;top:58%;width:5px;height:5px;margin:-3px 0 0 -2px;border-radius:50%;background:currentColor;opacity:0;animation:sp-deb .85s 2s cubic-bezier(.15,.7,.35,1) forwards}
.sp-word{position:absolute;left:0;right:0;top:calc(58% - 92px);height:92px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;gap:2px;padding-bottom:4px;box-sizing:border-box;font-family:var(--f);font-size:62px;font-weight:800;line-height:1}
.sp-word b{display:inline-block;transform:translateY(115%);animation:sp-up .95s cubic-bezier(.16,1,.3,1) var(--d) forwards}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.sp-word b{background:linear-gradient(105deg,var(--fg) 0 40%,var(--mute) 50%,var(--fg) 60% 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sp-up .95s cubic-bezier(.16,1,.3,1) var(--d) forwards,sp-shine 1.2s ease-in-out calc(var(--d) + 1s) forwards}}
.sp-tag{position:absolute;left:0;right:0;top:calc(58% + 46px);margin:0;text-align:center;color:var(--mute);font-size:14px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;opacity:0;filter:blur(8px);animation:sp-tag 1.1s 2.75s cubic-bezier(.16,1,.3,1) forwards}
@keyframes sp-line{to{transform:scaleX(1)}}
@keyframes sp-ball{0%{transform:translateY(-66vh) scale(.9,1.12);animation-timing-function:cubic-bezier(.5,0,1,.5)}38%{transform:translateY(0) scale(1,1)}41%{transform:translateY(0) scale(1.42,.6);animation-timing-function:ease-out}44%{transform:translateY(-1vh) scale(.96,1.06);animation-timing-function:cubic-bezier(0,.5,.5,1)}58%{transform:translateY(-20vh) scale(.95,1.08);animation-timing-function:cubic-bezier(.5,0,1,.5)}72%{transform:translateY(0) scale(1,1)}74%{transform:translateY(0) scale(1.25,.78);animation-timing-function:ease-out}76%{transform:translateY(-1vh) scale(.97,1.04);animation-timing-function:cubic-bezier(0,.5,.5,1)}83%{transform:translateY(-7vh) scale(.96,1.06);animation-timing-function:cubic-bezier(.5,0,1,.5)}90%{transform:translateY(0) scale(1,1)}92%{transform:translateY(0) scale(1.6,.5);opacity:1}96%,100%{transform:translateY(0) scale(2.6,.1);opacity:0}}
@keyframes sp-shadow{0%{opacity:0;transform:scaleX(.3)}38%{opacity:.32;transform:scaleX(1)}58%{opacity:.12;transform:scaleX(.55)}72%{opacity:.32;transform:scaleX(1)}83%{opacity:.18;transform:scaleX(.7)}90%{opacity:.32;transform:scaleX(1.05)}96%,100%{opacity:0;transform:scaleX(1.8)}}
@keyframes sp-ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(11,3)}}
@keyframes sp-crack{0%{opacity:1;stroke-dashoffset:520}100%{opacity:1;stroke-dashoffset:0}}
@keyframes sp-deb{0%{opacity:1;transform:translate(0,0)}60%{opacity:1;transform:translate(calc(var(--dx)*.8),var(--dy))}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 44px))}}
@keyframes sp-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,-1px)}}

#app.watch{height:100dvh;min-height:0;max-width:430px;border:0;background:#000;color:#fff;--home-red:#ff3040}
