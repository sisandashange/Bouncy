<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BOUNCY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--f:'Bricolage Grotesque',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--fg:#000;--mute:#666;--line:#e2e2e2}}
:root[data-theme="light"]{--bg:#fff;--fg:#000;--mute:#666;--line:#e2e2e2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#app{max-width:430px;height:100%;margin:auto;display:flex;flex-direction:column;border-inline:1px solid var(--line);position:relative;overflow:hidden}
header{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:22px;letter-spacing:.02em;gap:8px}
header i{width:14px;height:14px;border-radius:50%;background:var(--fg);animation:hop 1s infinite;transform-origin:bottom}
@keyframes hop{50%{transform:translateY(-6px)}}
main{flex:1;position:relative;min-height:0}
.v{position:absolute;inset:0;overflow-y:auto}
.hide{display:none}
#feed{scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:var(--bg)}
.clip.real{--fg:#fff;--bg:#000}
.p0{background-image:repeating-linear-gradient(90deg,transparent 0 28px,var(--line) 28px 30px)}
.p1{background-image:radial-gradient(var(--line) 2px,transparent 2px);background-size:24px 24px}
.p2{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.p3{background-image:repeating-linear-gradient(45deg,transparent 0 22px,var(--line) 22px 24px)}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ball{position:absolute;left:calc(50% - 32px);bottom:36%;width:64px;height:64px;border-radius:50%;background:var(--fg);transform-origin:bottom;animation:b 1.2s infinite}
.sh{position:absolute;left:calc(50% - 32px);bottom:calc(36% - 8px);width:64px;height:12px;border-radius:50%;background:var(--fg);animation:s 1.2s infinite}
.clip:not(.on) .ball,.clip:not(.on) .sh{animation-play-state:paused}
@keyframes b{0%,100%{transform:translateY(0) scale(1.3,.7);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-190px) scale(.92,1.1);animation-timing-function:cubic-bezier(.6,0,.8,.3)}}
@keyframes s{0%,100%{transform:scale(1.2);opacity:.35}50%{transform:scale(.4);opacity:.1}}
.side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.side button{display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;min-height:52px;font-size:12px;font-weight:800;color:var(--fg);text-shadow:0 0 6px var(--bg)}
svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.liked svg{fill:currentColor}
.meta{position:absolute;left:14px;right:80px;bottom:24px;color:var(--fg);text-shadow:0 0 8px var(--bg)}
.meta strong{font-weight:800;font-size:17px;margin-right:10px}
.meta p{margin:6px 0 0;line-height:1.35}
.fol{border:1.5px solid var(--fg);border-radius:20px;padding:4px 14px;font-weight:800;font-size:13px;background:var(--bg)}
.fol.on{background:var(--fg);color:var(--bg)}
.burst{position:absolute;font-size:80px;line-height:1;pointer-events:none;color:var(--fg);animation:pop .7s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1.4) translateY(-30px);opacity:0}}
nav{height:60px;display:flex;border-top:1px solid var(--line)}
nav button{flex:1;font-weight:800;font-size:14px;color:var(--mute)}
nav button.on{color:var(--fg)}
nav .plus{flex:0 0 64px}
nav .plus span{display:inline-grid;place-items:center;width:46px;height:34px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:24px;line-height:1}
h2{font-size:26px;margin:18px 16px 4px;font-weight:800}
.sub{margin:0 16px 14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tile{aspect-ratio:3/4;position:relative;border:0;background-color:var(--bg);color:var(--fg);text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;outline:1px solid var(--line)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile b,.tile span{position:relative;text-shadow:0 0 6px var(--bg)}
.tile .rk{position:absolute;top:8px;left:10px;font-size:34px;font-weight:800}
.prof{display:flex;gap:16px;align-items:center;padding:20px 16px}
.av{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:800}
.stats{display:flex;gap:20px}.stats div{text-align:center}.stats b{display:block;font-size:20px}.stats span{color:var(--mute);font-size:13px}
.empty{padding:40px 24px;text-align:center;color:var(--mute);grid-column:1/-1}
.btn{background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 20px;font-weight:800;margin-top:14px}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:5}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:75%;background:var(--bg);border-top:1.5px solid var(--fg);border-radius:20px 20px 0 0;padding:16px;display:none;flex-direction:column;z-index:6}
#shade.o,#sheet.o{display:flex}
#sheet h3{margin:0 0 10px;font-size:18px;font-weight:800}
#sheet .list{overflow-y:auto;flex:1;min-height:80px}
.cm{padding:8px 0;border-bottom:1px solid var(--line)}.cm b{margin-right:8px}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:12px;padding:12px;font:inherit}
.row .btn{margin:0}
#sheet video{width:100%;max-height:34vh;background:#000;border-radius:12px}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.o{opacity:1}
@media (prefers-reduced-motion:reduce){.ball,.sh,header i{animation:none}.ball{transform:translateY(-90px)}}
.col{display:flex;flex-direction:column;gap:10px}[hidden]{display:none!important}.tile{background:#000;color:#fff}.tile b,.tile span{text-shadow:0 0 6px #000}</style></head><body>
<div id="app">
<header><i></i>BOUNCY</header>
<main>
<div id="feed" class="v"></div>
<div id="trend" class="v hide"></div>

</main>

<div id="shade"></div><div id="sheet" role="dialog"></div><div id="toast" role="status"></div>
<input type="file" id="file" accept="video/*" hidden><input type="file" id="pic" accept="image/*" hidden>
</div>
<script>
const SB_URL='https://lakupnehsetdazezlsrs.supabase.co',SB_KEY='sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const I={heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4m0 0h12l-2 4 2 4H5"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7 8m5-5 5 5M5 13v8h14v-8"/></svg>'};
const fmt=n=>n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'k':String(n);
const pub=p=>sb.storage.from('videos').getPublicUrl(p).data.publicUrl;
const feed=$('#feed'),sheet=$('#sheet'),shade=$('#shade');
let me=null,clips=[],tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('o'),2200)}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d}
function open(node){sheet.replaceChildren(node);sheet.classList.add('o');shade.classList.add('o')}
function close(){if(!me)return;sheet.classList.remove('o');shade.classList.remove('o');sheet.querySelectorAll('video').forEach(v=>v.pause())}
shade.onclick=close;

function sync(c){const s=c.el;s.querySelector('[data-a=like]').classList.toggle('liked',!!c.liked);s.querySelector('[data-a=like] b').textContent=fmt(c.l);s.querySelector('[data-a=cm] b').textContent=fmt(c.cb);const f=s.querySelector('.fol');f.hidden=c.o===me.id;s.querySelector('[data-a=rp]').hidden=c.o===me.id;f.textContent=c.fol?'Following':'Follow';f.classList.toggle('on',!!c.fol)}
function mk(c){const s=document.createElement('section');s.className='clip real';
s.innerHTML='<video loop muted playsinline preload="metadata"></video><div class="side"><button data-a="like" aria-label="Like">'+I.heart+'<b></b></button><button data-a="cm" aria-label="Comments">'+I.chat+'<b></b></button><button data-a="sh" aria-label="Share">'+I.share+'<b>Share</b></button><button data-a="rp" aria-label="Report">'+I.flag+'<b>Report</b></button></div><div class="meta"><div><strong></strong><button class="fol" data-a="fol"></button></div><p></p></div>';
s.querySelector('video').src=pub(c.path);s.querySelector('strong').textContent='@'+c.u;s.querySelector('p').textContent=c.c;c.el=s;sync(c);io.observe(s);return s}
async function hydrate(v){if(!v.length)return[];
const ids=[...new Set(v.map(x=>x.owner_id))];
const [p,l,f]=await Promise.all([sb.from('profiles').select('id,username').in('id',ids),sb.from('video_likes').select('video_id').in('video_id',v.map(x=>x.id)).eq('user_id',me.id),sb.from('follows').select('followed_id').eq('follower_id',me.id)]);
const pm=Object.fromEntries((p.data||[]).map(x=>[x.id,x.username])),ls=new Set((l.data||[]).map(x=>x.video_id)),fs=new Set((f.data||[]).map(x=>x.followed_id));
return v.map(x=>({id:x.id,o:x.owner_id,u:pm[x.owner_id]||'user',c:x.caption,path:x.storage_path,l:x.like_count,cb:x.comment_count,liked:ls.has(x.id)?1:0,fol:fs.has(x.owner_id)?1:0}))}
const COLS='id,owner_id,caption,storage_path,like_count,comment_count';
async function load(){const {data,error}=await sb.from('videos').select(COLS).order('created_at',{ascending:false}).limit(20);
if(error){toast('Couldn’t load videos. Check your connection.');return}
feed.replaceChildren();clips=await hydrate(data);
if(!clips.length){const e=el('<div class="empty" style="padding-top:30%">No videos yet.<br>Be the first to post on BOUNCY.<br><button class="btn">Upload a video</button></div>');e.querySelector('button').onclick=()=>$('#file').click();feed.append(e);return}
clips.forEach(c=>feed.append(mk(c)))}
async function like(c){const on=!c.liked;c.liked=on?1:0;c.l+=on?1:-1;sync(c);
const r=on?await sb.from('video_likes').insert({video_id:c.id,user_id:me.id}):await sb.from('video_likes').delete().eq('video_id',c.id).eq('user_id',me.id);
if(r.error){c.liked=on?0:1;c.l+=on?-1:1;sync(c);toast('Couldn’t save your like')}}
async function follow(c){const on=!c.fol;
const r=on?await sb.from('follows').insert({follower_id:me.id,followed_id:c.o}):await sb.from('follows').delete().eq('follower_id',me.id).eq('followed_id',c.o);
if(r.error){toast('Couldn’t update follow');return}
clips.filter(x=>x.o==c.o).forEach(x=>{x.fol=on?1:0;sync(x)});toast(on?'Following @'+c.u:'Unfollowed')}
function act(a,c){if(a=='like')like(c);if(a=='fol')follow(c);if(a=='cm')comments(c);if(a=='rp')report(c);if(a=='sh'){if(navigator.share)navigator.share({title:'BOUNCY',text:c.c,url:location.href}).catch(()=>{});else toast('Sharing isn’t available in this browser')}}
let lt=0;
feed.addEventListener('click',e=>{const s=e.target.closest('.clip');if(!s)return;const c=clips.find(x=>x.el===s),b=e.target.closest('button');
if(b){act(b.dataset.a,c);return}
const n=Date.now();
if(n-lt<320){if(!c.liked)like(c);const h=document.createElement('span');h.className='burst';h.textContent='♥';const r=s.getBoundingClientRect();h.style.left=(e.clientX-r.left-40)+'px';h.style.top=(e.clientY-r.top-40)+'px';s.append(h);setTimeout(()=>h.remove(),700)}
else{const v=s.querySelector('video');v.muted=!v.muted;toast(v.muted?'Sound off':'Sound on')}
lt=n});
async function comments(c){const d=el('<h3>Comments</h3><div class="list">Loading…</div><div class="row"><input type="text" id="ci" maxlength="500" placeholder="Add a comment" aria-label="Add a comment"><button class="btn" id="cs">Send</button></div>');open(d);
const L=d.querySelector('.list');
const add=(u,t)=>{const x=document.createElement('div');x.className='cm';const b=document.createElement('b');b.textContent=u;x.append(b,t);L.append(x)};
const {data,error}=await sb.from('video_comments').select('user_id,body').eq('video_id',c.id).order('created_at').limit(100);
if(error){L.textContent='Couldn’t load comments.'}else{const ids=[...new Set(data.map(x=>x.user_id))];const p=ids.length?(await sb.from('profiles').select('id,username').in('id',ids)).data||[]:[];const pm=Object.fromEntries(p.map(x=>[x.id,x.username]));L.replaceChildren();if(!data.length)L.textContent='No comments yet. Say something first.';data.forEach(x=>add(pm[x.user_id]||'user',x.body))}
d.querySelector('#cs').onclick=async()=>{const i=d.querySelector('#ci'),t=i.value.trim();if(!t)return;const r=await sb.from('video_comments').insert({video_id:c.id,user_id:me.id,body:t});
if(r.error){toast('Couldn’t post your comment');return}
if(!data||!data.length&&!L.querySelector('.cm'))L.replaceChildren();add(me.username,t);i.value='';c.cb++;if(c.el)sync(c)}}
function watch(c){const d=el('<h3></h3><video controls autoplay loop playsinline></video>');d.querySelector('h3').textContent='@'+c.u+' · '+c.c;d.querySelector('video').src=pub(c.path);
if(c.o===me.id){const x=document.createElement('button');x.className='fol';x.textContent='Delete video';x.style.marginTop='12px';x.onclick=()=>del(c);d.append(x)}open(d)}
async function del(c){if(!confirm('Delete this video? This can’t be undone.'))return;const r=await sb.from('videos').delete().eq('id',c.id);if(r.error){toast('Couldn’t delete the video');return}await sb.storage.from('videos').remove([c.path]);close();hideClip(c);clips=clips.filter(k=>k!==c);toast('Video deleted');if(!$('#me').classList.contains('hide'))drawMe()}
function hideClip(c){if(c.el){io.unobserve(c.el);c.el.remove()}}
function report(c){const d=el('<h3>Report this video</h3><div class="col" id="rs"></div><button class="fol" id="bk" style="margin-top:14px"></button>');
['Spam or scam','Nudity or sexual content','Violence or dangerous acts','Hate or harassment','Copyright or stolen content','Something else'].forEach(r=>{const b=document.createElement('button');b.className='btn';b.style.margin='0';b.textContent=r;b.onclick=async()=>{const x=await sb.from('reports').insert({reporter_id:me.id,reported_user_id:c.o,video_id:c.id,reason:r});close();if(x.error&&x.error.code!='23505'){toast('Couldn’t send your report');return}hideClip(c);toast('Thanks. We’ll review this video.')};d.querySelector('#rs').append(b)});
const bk=d.querySelector('#bk');bk.textContent='Block @'+c.u;bk.onclick=async()=>{const x=await sb.from('blocked_users').insert({blocker_id:me.id,blocked_id:c.o});close();if(x.error&&x.error.code!='23505'){toast('Couldn’t block this user');return}clips.filter(k=>k.o==c.o).forEach(hideClip);toast('Blocked @'+c.u)};open(d)}
function tile(c,rank){const t=document.createElement('button');t.className='tile';const v=document.createElement('video');v.src=pub(c.path)+'#t=0.1';v.muted=true;v.preload='metadata';t.append(v);
if(rank){const r=document.createElement('span');r.className='rk';r.textContent=rank;t.append(r)}
const b=document.createElement('b');b.textContent='@'+c.u;const s=document.createElement('span');s.textContent=fmt(c.l)+' likes';t.append(b,s);t.onclick=()=>watch(c);return t}
function show(v){['feed','trend','me'].forEach(k=>$('#'+k).classList.toggle('hide',k!=v));document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='trend')drawTrend();if(v=='me')drawMe()}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));
async function drawTrend(){const d=$('#trend');d.replaceChildren(el('<h2>Trending</h2><p class="sub">Ranked by likes right now.</p>'));
const {data}=await sb.from('videos').select(COLS).order('like_count',{ascending:false}).order('created_at',{ascending:false}).limit(30);
const g=document.createElement('div');g.className='grid';const cs=await hydrate(data||[]);
if(!cs.length)g.append(el('<div class="empty">Nothing is trending yet. Post a video to get things moving.</div>').firstChild);
cs.forEach((c,i)=>g.append(tile(c,i+1)));d.append(g)}
async function drawMe(){const d=$('#me');
const [v,fr,fg]=await Promise.all([sb.from('videos').select(COLS).eq('owner_id',me.id).order('created_at',{ascending:false}),sb.from('follows').select('*',{count:'exact',head:true}).eq('followed_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id)]);
const m=await hydrate(v.data||[]);
const h=el('<div class="prof"><div class="av"></div><div><b style="font-size:20px"></b><div class="stats" style="margin-top:8px"><div><b>'+m.length+'</b><span>Videos</span></div><div><b>'+(fr.count||0)+'</b><span>Followers</span></div><div><b>'+(fg.count||0)+'</b><span>Following</span></div></div></div></div>');
const av=h.querySelector('.av');if(me.avatar){const im=document.createElement('img');im.src=me.avatar;im.alt='';im.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover';av.append(im)}else av.textContent=me.username[0].toUpperCase();h.querySelector('b').textContent='@'+me.username;
const lo=document.createElement('button');lo.className='fol';lo.textContent='Log out';lo.style.margin='0 16px 8px';lo.onclick=()=>sb.auth.signOut();
const ed=document.createElement('button');ed.className='fol on';ed.textContent='Edit profile';ed.onclick=editProfile;
const bar=document.createElement('div');bar.style.cssText='display:flex;gap:8px;margin:0 16px 8px';lo.style.margin='0';bar.append(ed,lo);
const parts=[h];if(me.bio){const q=document.createElement('p');q.style.cssText='margin:0 16px 12px;line-height:1.35';q.textContent=me.bio;parts.push(q)}
d.replaceChildren(...parts,bar);
const g=document.createElement('div');g.className='grid';
if(!m.length){const e=el('<div class="empty">No videos yet.<br>Upload your first one and it shows up here.<br><button class="btn">Upload a video</button></div>').firstChild;e.querySelector('button').onclick=()=>$('#file').click();g.append(e)}
m.forEach(c=>g.append(tile(c)));d.append(g);
const ft=el('<p class="sub" style="margin:18px 16px"><a href="privacy.html" style="color:inherit">Privacy policy</a></p>');const da=document.createElement('button');da.className='fol';da.textContent='Delete account';da.style.margin='0 16px 24px';da.onclick=delAccountSheet;d.append(ft,da)}
function delAccountSheet(){const d=el('<h3>Delete your account</h3><p class="sub" style="margin:0 0 12px">This permanently removes your profile, videos, comments, likes and follows. It can’t be undone.</p><div class="col"><input type="password" id="dp" placeholder="Enter your password to confirm" aria-label="Password" autocomplete="current-password"></div><div class="row"><button class="btn" id="dd">Delete my account</button></div><p id="dm" class="sub" style="margin:10px 0 0" role="alert"></p>');
const g=s=>d.querySelector(s),msg=t=>g('#dm').textContent=t;
g('#dd').onclick=async()=>{const b=g('#dd');b.disabled=true;msg('');
const ok=await sb.auth.signInWithPassword({email:me.email,password:g('#dp').value});
if(ok.error){msg('That password isn’t right.');b.disabled=false;return}
for(let i=0;i<20;i++){const l=await sb.storage.from('videos').list(me.id,{limit:100});if(!l.data||!l.data.length)break;const rm=await sb.storage.from('videos').remove(l.data.map(x=>me.id+'/'+x.name));if(rm.error)break}
const r=await sb.rpc('delete_my_account');
if(r.error){msg('Couldn’t delete your account. Try again.');b.disabled=false;return}
await sb.auth.signOut();toast('Account deleted')};open(d)}
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
if(f.size>52428800){toast('Videos must be under 50 MB');return}
const d=el('<h3>New video</h3><video controls playsinline muted></video><div class="row"><input type="text" id="cap" maxlength="150" placeholder="Write a caption" aria-label="Caption"><button class="btn" id="post">Post</button></div>');
d.querySelector('video').src=URL.createObjectURL(f);
d.querySelector('#post').onclick=async()=>{const b=d.querySelector('#post');b.disabled=true;b.textContent='Posting…';
const reset=m=>{toast(m);b.disabled=false;b.textContent='Post'};
const ext=((f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,''))||'mp4';
const path=me.id+'/'+crypto.randomUUID()+'.'+ext;
const up=await sb.storage.from('videos').upload(path,f,{contentType:f.type||'video/mp4'});
if(up.error)return reset('Upload failed. Use an MP4, MOV or WebM under 50 MB.');
const ins=await sb.from('videos').insert({owner_id:me.id,caption:d.querySelector('#cap').value.trim(),storage_path:path});
if(ins.error)return reset('Couldn’t publish the video. Try again.');
close();toast('Posted');await load();show('feed');feed.scrollTop=0};
open(d)};
function editProfile(){const d=el('<h3>Edit profile</h3><div class="col"><button class="btn" id="ph" style="margin:0">Change photo</button><input type="text" id="eu" maxlength="30" aria-label="Username" placeholder="Username"><input type="text" id="eb" maxlength="300" aria-label="Bio" placeholder="Bio"></div><div class="row"><button class="btn" id="sv">Save</button></div><p id="em" class="sub" style="margin:10px 0 0" role="alert"></p>');
const g=s=>d.querySelector(s),msg=t=>g('#em').textContent=t;g('#eu').value=me.username;g('#eb').value=me.bio;
g('#ph').onclick=()=>$('#pic').click();
g('#sv').onclick=async()=>{const u=g('#eu').value.trim(),b=g('#eb').value.trim();if(!/^[A-Za-z0-9_.]{3,30}$/.test(u)){msg('Pick a username with 3 to 30 letters, numbers, dots or underscores.');return}
const r=await sb.from('profiles').update({username:u,bio:b}).eq('id',me.id);
if(r.error){msg(r.error.code=='23505'?'That username is taken. Try another.':'Couldn’t save your profile.');return}
me.username=u;me.bio=b;close();drawMe();toast('Profile saved')};open(d)}
$('#pic').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
const im=new Image();im.src=URL.createObjectURL(f);try{await im.decode()}catch(_){toast('That image can’t be read');return}
const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));const path=me.id+'/avatar-'+Date.now()+'.jpg';
const up=await sb.storage.from('videos').upload(path,bl,{contentType:'image/jpeg'});if(up.error){toast('Couldn’t upload your photo');return}
const url=pub(path),r=await sb.from('profiles').update({avatar_url:url}).eq('id',me.id);if(r.error){toast('Couldn’t save your photo');return}
me.avatar=url;close();drawMe();toast('Photo updated')};
function authSheet(){const d=el('<h3>Join BOUNCY</h3><div class="col"><input type="text" id="an" placeholder="Name (sign up)" aria-label="Name" autocomplete="name"><input type="text" id="au" placeholder="Username (sign up)" aria-label="Username" autocomplete="username" maxlength="30"><input type="email" id="ae" placeholder="Email" aria-label="Email" autocomplete="email"><input type="password" id="ap" placeholder="Password (8+ characters)" aria-label="Password" autocomplete="current-password"></div><div class="row"><button class="btn" id="li">Log in</button><button class="btn" id="su">Create account</button></div><p class="sub" style="margin:10px 0 0">By joining, you agree to our <a href="privacy.html" target="_blank" rel="noopener" style="color:inherit">privacy policy</a>.</p><p id="am" class="sub" style="margin:10px 0 0" role="alert"></p>');
const g=s=>d.querySelector(s),msg=t=>g('#am').textContent=t;
g('#li').onclick=async()=>{msg('');const r=await sb.auth.signInWithPassword({email:g('#ae').value.trim(),password:g('#ap').value});if(r.error)msg(r.error.message)};
g('#su').onclick=async()=>{msg('');const u=g('#au').value.trim();if(!/^[A-Za-z0-9_.]{3,30}$/.test(u)){msg('Pick a username with 3 to 30 letters, numbers, dots or underscores.');return}
const r=await sb.auth.signUp({email:g('#ae').value.trim(),password:g('#ap').value,options:{data:{name:g('#an').value.trim(),username:u}}});
if(r.error)msg(r.error.message);else if(!r.data.session)msg('Check your email to confirm your account, then log in.')};
open(d)}
async function start(user){me=user;me.email=user.email;const {data}=await sb.from('profiles').select('username,avatar_url,bio').eq('id',user.id).single();me.username=data?data.username:'user';me.avatar=data&&data.avatar_url;me.bio=(data&&data.bio)||'';
const want=user.user_metadata&&user.user_metadata.username;
if(want&&me.username.startsWith('user_')){const r=await sb.from('profiles').update({username:want}).eq('id',user.id);if(!r.error)me.username=want;else toast('That username is taken. You can change it later.')}
close();show('feed');await load()}
sb.auth.onAuthStateChange((ev,s)=>{if((ev=='SIGNED_IN'||ev=='INITIAL_SESSION')&&s&&(!me||me.id!==s.user.id))setTimeout(()=>start(s.user),0);if(ev=='SIGNED_OUT'){me=null;feed.replaceChildren();clips=[];authSheet()}});
sb.auth.getSession().then(({data})=>{if(!data.session&&!me)authSheet()});
</script></body></html>
